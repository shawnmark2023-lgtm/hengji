name: Beta quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: beta-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-integrity:
    name: Locked and verified Gradle dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Resolve all locked project dependencies in strict mode
        run: ./gradlew resolveAllDependencies --dependency-verification strict --no-configuration-cache --stacktrace
      - name: Resolve all locked quality-harness dependencies in strict mode
        run: ./gradlew -p quality/harness resolveAllDependencies --dependency-verification strict --no-configuration-cache --stacktrace
      - name: Resolve all locked coverage-tool dependencies in strict mode
        run: ./gradlew -p quality/coverage-tools resolveAllDependencies --dependency-verification strict --no-configuration-cache --stacktrace

  static-guards:
    name: Format, architecture, release, and reproducibility guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run static formatting, architecture, release, and supply-chain guards
        run: python scripts/quality/run_quality.py --gates formatting architecture release-guards reproducibility --output-dir quality-evidence
      - name: Upload static evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-static-evidence
          path: quality-evidence/
          if-no-files-found: ignore

  coverage:
    name: Shared Windows and Android coverage thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: android-actions/setup-android@v3
      - name: Enforce committed line and branch thresholds
        run: python scripts/quality/run_quality.py --gates coverage --output-dir quality-evidence
      - name: Upload coverage evidence and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-coverage-evidence
          path: |
            quality-evidence/
            quality/evidence/coverage/
          if-no-files-found: ignore

  reproducible-artifacts:
    name: Reproducible ${{ matrix.target }} artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: android-actions/setup-android@v3
        if: matrix.target == 'android'
      - name: Build twice from one source snapshot and compare normalized archive content
        run: python scripts/quality/reproducible_build.py --target ${{ matrix.target }} --output quality-evidence/reproducible-${{ matrix.target }}.json
      - name: Upload reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducible-${{ matrix.target }}-evidence
          path: quality-evidence/
          if-no-files-found: ignore

  malformed-import:
    name: Malformed import harness
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exercise real Kotlin importer failure contracts
        run: python scripts/quality/run_quality.py --gates malformed-import --output-dir quality-evidence
      - name: Upload malformed-import evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: malformed-import-evidence
          path: quality-evidence/
          if-no-files-found: ignore

  large-ledger:
    name: Large-ledger developer baseline
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exercise 100,000-row real in-memory ledger baseline
        shell: bash
        run: python scripts/quality/run_quality.py --gates large-ledger --benchmark-count 100000 --max-millis 20000 --max-memory-mib 768 --output-dir quality-evidence
      - name: Upload large-ledger evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: large-ledger-${{ runner.os }}-evidence
          path: quality-evidence/
          if-no-files-found: ignore
