name: Client quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: client-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-tests:
    name: Desktop tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test shared and desktop modules
        shell: bash
        run: |
          echo "GATE_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          ./gradlew :modules:core-domain:desktopTest :modules:core-data:desktopTest :modules:core-insights:desktopTest :modules:connectors:desktopTest :apps:client:desktopTest :apps:client:compileKotlinDesktop --stacktrace
      - name: Record passed desktop evidence
        shell: bash
        run: |
          python scripts/quality/generate_evidence.py \
            --gate "desktop-${{ runner.os }}" \
            --status passed \
            --command "./gradlew :modules:core-domain:desktopTest :modules:core-data:desktopTest :modules:core-insights:desktopTest :modules:connectors:desktopTest :apps:client:desktopTest :apps:client:compileKotlinDesktop --stacktrace" \
            --started-at "$GATE_STARTED_AT" \
            --junit-glob "**/build/test-results/desktopTest/TEST-*.xml" \
            --output "quality-evidence/desktop-${{ runner.os }}.json"
      - name: Upload desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-evidence
          path: quality-evidence/
          if-no-files-found: ignore

  android-debug:
    name: Android host tests and debug compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: android-actions/setup-android@v3
      - name: Test Android data boundary and assemble debug APK
        run: |
          echo "GATE_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          ./gradlew :modules:core-data:testAndroidHostTest :apps:client:androidApp:assembleDebug --stacktrace
      - name: Record passed Android evidence
        run: |
          python scripts/quality/generate_evidence.py \
            --gate android-debug \
            --status passed \
            --command "./gradlew :modules:core-data:testAndroidHostTest :apps:client:androidApp:assembleDebug --stacktrace" \
            --started-at "$GATE_STARTED_AT" \
            --junit-glob "modules/core-data/build/test-results/testAndroidHostTest/TEST-*.xml" \
            --artifact apps/client/androidApp/build/outputs/apk/debug/androidApp-debug.apk \
            --limitation "Host tests use an injected protector; real device Keystore, production signing, installation, upgrade, and Play review remain unverified" \
            --output quality-evidence/android-debug.json
      - name: Upload Android artifact and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-and-evidence
          path: |
            apps/client/androidApp/build/outputs/apk/debug/androidApp-debug.apk
            quality-evidence/
          if-no-files-found: ignore

  apple-compile:
    name: Apple framework and simulator tests
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and link Apple frameworks and run simulator tests
        run: |
          echo "GATE_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          ./gradlew \
            :apps:client:iosSimulatorArm64Test \
            :apps:client:linkDebugFrameworkIosSimulatorArm64 \
            :apps:client:linkReleaseFrameworkIosSimulatorArm64 \
            :apps:client:linkReleaseFrameworkIosArm64 \
            --stacktrace
      - name: Record passed Apple compile evidence
        run: |
          python scripts/quality/generate_evidence.py \
            --gate apple-simulator-compile \
            --status passed \
            --command "./gradlew :apps:client:iosSimulatorArm64Test :apps:client:linkDebugFrameworkIosSimulatorArm64 :apps:client:linkReleaseFrameworkIosSimulatorArm64 :apps:client:linkReleaseFrameworkIosArm64 --stacktrace" \
            --started-at "$GATE_STARTED_AT" \
            --limitation "Kotlin/Native tests and framework links only; Keychain round trips, the Swift host, simulator app launch, device execution, signing, notarization, TestFlight, and App Store approval remain unverified" \
            --output quality-evidence/apple-simulator-compile.json
      - name: Upload Apple compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-simulator-compile-evidence
          path: quality-evidence/
          if-no-files-found: ignore

  windows-package:
    name: Windows unsigned MSI package
    needs: desktop-tests
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build unsigned MSI
        shell: pwsh
        run: |
          "GATE_STARTED_AT=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))" >> $env:GITHUB_ENV
          .\gradlew.bat :apps:client:packageMsi --stacktrace
      - name: Record passed MSI packaging evidence
        shell: pwsh
        run: |
          python scripts/quality/generate_evidence.py `
            --gate windows-msi-package `
            --status passed `
            --command ".\gradlew.bat :apps:client:packageMsi --stacktrace" `
            --started-at "$env:GATE_STARTED_AT" `
            --artifact-glob "apps/client/build/compose/binaries/main/msi/*.msi" `
            --limitation "Unsigned package build only; installation, upgrade, uninstall, SmartScreen, and signing remain unverified" `
            --output quality-evidence/windows-msi-package.json
      - name: Upload MSI and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-and-evidence
          path: |
            apps/client/build/compose/binaries/main/msi/*.msi
            quality-evidence/
          if-no-files-found: ignore

  macos-package:
    name: macOS unsigned DMG package
    needs: desktop-tests
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build unsigned DMG
        run: |
          echo "GATE_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          ./gradlew :apps:client:packageDmg --stacktrace
      - name: Record passed DMG packaging evidence
        run: |
          python scripts/quality/generate_evidence.py \
            --gate macos-dmg-package \
            --status passed \
            --command "./gradlew :apps:client:packageDmg --stacktrace" \
            --started-at "$GATE_STARTED_AT" \
            --artifact-glob "apps/client/build/compose/binaries/main/dmg/*.dmg" \
            --limitation "Unsigned package build only; Keychain round trips, installation, upgrade, Developer ID signing, notarization, and Gatekeeper remain unverified" \
            --output quality-evidence/macos-dmg-package.json
      - name: Upload DMG and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-and-evidence
          path: |
            apps/client/build/compose/binaries/main/dmg/*.dmg
            quality-evidence/
          if-no-files-found: ignore
