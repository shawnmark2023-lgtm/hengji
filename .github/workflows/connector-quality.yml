name: Connector and service quality

on:
  pull_request:
    paths:
      - "modules/connectors/**"
      - "services/**"
      - "samples/**"
      - "docs/05-security-threat-model.md"
      - "docs/06-api-contracts.md"
      - ".github/workflows/connector-quality.yml"
      - ".github/workflows/beta-quality-gates.yml"
      - "quality/**"
      - "scripts/quality/**"
      - "gradle/**"
      - "gradlew*"
      - "settings.gradle.kts"
  push:
    branches: [main]
    paths:
      - "modules/connectors/**"
      - "services/**"
      - "samples/**"
      - "quality/**"
      - "scripts/quality/**"

permissions:
  contents: read

concurrency:
  group: connector-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin-connectors:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test common connector contracts on desktop JVM
        run: ./gradlew :modules:connectors:desktopTest --stacktrace

  apple-connector-compile:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Compile iOS simulator connector target
        run: ./gradlew :modules:connectors:compileKotlinIosSimulatorArm64 --stacktrace

  typescript-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/connector-gateway
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/connector-gateway/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run typecheck:price
      - run: npm test
      - run: npm audit --audit-level=high

  python-price-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/price-intelligence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v

  release-guards:
    name: Secret and sandbox/production guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run shared release guards
        run: python scripts/quality/run_quality.py --gates release-guards --output-dir quality-evidence
      - name: Upload release-guard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: connector-release-guard-evidence
          path: quality-evidence/
          if-no-files-found: ignore
