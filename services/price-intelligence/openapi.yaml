openapi: 3.1.0
info:
  title: HENGJI Price Intelligence
  version: 0.1.0
  description: Deterministic quote aggregation; does not scrape marketplaces.
servers:
  - url: http://127.0.0.1:8790
    description: Local development
paths:
  /health:
    get:
      operationId: priceHealth
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ok }
  /v1/estimates:
    post:
      operationId: estimateSecondHandPrice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstimateRequest" }
      responses:
        "200":
          description: Deterministic estimate with provenance and confidence.
          headers:
            Cache-Control:
              schema: { const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceEstimate" }
        "400": { $ref: "#/components/responses/ClientError" }
        "413": { $ref: "#/components/responses/ClientError" }
        "415": { $ref: "#/components/responses/ClientError" }
components:
  schemas:
    MarketQuote:
      type: object
      additionalProperties: false
      required: [providerId, title, condition, priceMinor, shippingMinor, currency, observedAt, matchConfidence, provenance, isLive, disclosure]
      properties:
        providerId: { type: string, minLength: 1, maxLength: 64 }
        title: { type: string, minLength: 1, maxLength: 256 }
        model: { type: [string, "null"], maxLength: 128 }
        condition: { type: string, maxLength: 32 }
        priceMinor: { type: integer, format: int64, minimum: 0 }
        shippingMinor: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        observedAt: { type: string, format: date-time }
        matchConfidence: { type: number, minimum: 0, maximum: 1 }
        provenance: { enum: [manual, demo_non_live, official_or_contracted_api] }
        isLive: { type: boolean }
        disclosure: { type: string, minLength: 1, maxLength: 512 }
    EstimateRequest:
      type: object
      additionalProperties: false
      required: [currency, asOf, quotes]
      properties:
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        asOf: { type: string, format: date-time }
        minimumMatchConfidence: { type: number, minimum: 0, maximum: 1, default: 0.55 }
        freshnessHalfLifeDays: { type: integer, minimum: 1, maximum: 365, default: 30 }
        quotes:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/MarketQuote" }
    PriceEstimate:
      type: object
      required: [currency, sampleCount, rejectedCount, medianMinor, lowerQuartileMinor, upperQuartileMinor, confidence, confidenceBand, live, disclosure, calculatedAt]
      properties:
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        sampleCount: { type: integer, minimum: 0 }
        rejectedCount: { type: integer, minimum: 0 }
        medianMinor: { type: [integer, "null"], format: int64 }
        lowerQuartileMinor: { type: [integer, "null"], format: int64 }
        upperQuartileMinor: { type: [integer, "null"], format: int64 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        confidenceBand: { enum: [low, medium, high] }
        live: { type: boolean }
        disclosure: { type: string }
        calculatedAt: { type: string, format: date-time }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    ClientError:
      description: Stable validation error without quote payload echo.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
